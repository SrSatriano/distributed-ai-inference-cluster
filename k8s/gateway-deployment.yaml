apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: inference-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: WORKERS
              value: "http://inference-worker:8001"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
spec:
  selector:
    app: inference-gateway
  ports:
    - port: 80
      targetPort: 8080
